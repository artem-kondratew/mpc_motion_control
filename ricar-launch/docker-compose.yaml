services:
    vehicle:
        command: $CMD "source /autoware/install/setup.bash && ros2 launch tvp_launch tvp_core_vehicle.launch.xml vehicle_id:=$$VEHICLE_ID"
        extends:
            file: common.yaml
            service: app
        devices:
            - /dev:/dev
        profiles:
            - all
            - vehicle
            - benchmark

    # v2v: UDP-мост телеметрии «мимо ROS» между роботами (DDS изолированы localhost_only).
    # role=leader (alpha) -> sender читает свои топики и шлёт на PEER_IP; role=follower (bravo)
    # -> receiver принимает и переиздаёт зеркалом /<LEADER_ID>/... для acc_telemetry.
    v2v:
        command: $CMD "source /autoware/install/setup.bash &&
            ros2 launch v2v_bridge v2v.launch.py role:=$V2V_ROLE leader_id:=$LEADER_ID peer_ip:=$PEER_IP"
        extends:
            file: common.yaml
            service: app
        profiles:
            - all
            - v2v

    # --- НЕ нужно для turtlebot-MVP (autoware lanelet2-карты) ---
