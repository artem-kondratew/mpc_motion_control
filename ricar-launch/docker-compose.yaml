    # Сервис для отладки, менять и коммитить рекомендуется его
    debug:
        command: $CMD "sleep infinity"
        extends:
            file: common.yaml
            service: app
        profiles:
          #            - all
            - debug
            - benchmark

    # логирование: rosbag2 (mcap). Пишет топики контроллеров/локализации/полосы
    # в /logs/auto_<VEHICLE_ID>_<timestamp>. ros2parquet НЕ используется (нет в образе).
    logging:
        command: >
            $CMD 'source /autoware/install/setup.bash &&
            NS=$${VEHICLE_ID:-alpha} &&
            OUT=/logs/auto_$${NS}_$$(date +%Y_%m_%d_%H_%M_%S) &&
            echo "[logging] recording mcap (ns=$$NS) -> $$OUT" &&
            ros2 bag record --storage mcap -o "$$OUT" --regex
            "(/$$NS/control/.*|/$$NS/cmd_vel|/$$NS/commands/velocity|/$$NS/odom|/$$NS/lio_sam/mapping/(odometry|path)|/$$NS/sensing/livox/imu|/$$NS/sensing/vehicle_velocity_converter/twist_with_covariance|/tf|/tf_static|/human_triggers)"'
        extends:
            file: common.yaml
            service: app
        volumes:
            - /log_disk/logs:/logs:rw
        environment:
            LOGGING_MODE: ${LOGGING_MODE}
            LOGGING_DIRECTORY: ${LOGGING_DIRECTORY}
        profiles:
            - all
            - logging

