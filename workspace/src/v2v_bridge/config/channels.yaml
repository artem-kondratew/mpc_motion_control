# Каналы UDP-моста телеметрии (alpha -> bravo).
# Топик собирается как /<leader_id>/<suffix> (leader_id передаётся из launch:
#   на лидере = его VEHICLE_ID, на ведомом = PEER_ID — оба указывают на лидера).
# port — UDP-порт канала (sender шлёт, receiver биндит). max_rate — троттлинг
# отправки в Гц (0 = без ограничения; для статичной полосы достаточно ~2 Гц).
channels:
  - name: pose          # поза лидера (lio_sam, глобальная) — для зазора и s_leader
    suffix: lio_sam/mapping/odometry
    type: nav_msgs/msg/Odometry
    port: 47001
    max_rate: 0.0

  - name: vel           # измеренная продольная скорость лидера — для v_rel
    suffix: odom
    type: nav_msgs/msg/Odometry
    port: 47002
    max_rate: 0.0

  - name: path          # полоса лидера — переносится в bravo-фрейм для латерали
    suffix: control/pacemaker/path
    type: nav_msgs/msg/Path
    port: 47003
    max_rate: 2.0
