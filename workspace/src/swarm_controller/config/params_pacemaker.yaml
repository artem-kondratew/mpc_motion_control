/**:
  ros__parameters:
    logs_dir: /home/user/swarm_ws/swarm_logs
    pacemaker_idx: 1
    start: false
    cmd_vel_topic: /robot1/cmd_vel
    trajectory: lanelet      # straight | circle | lanelet
    linear_vel: 0.4          # [m/s]  used for straight and lanelet
    circle_linear_vel: 0.3   # [m/s]  tangential speed for circle
    circle_radius: 4.0       # [m]    circle radius (w = v / R)
    lookahead_dist: 1.0      # [m]    pure pursuit lookahead distance
    # ── trajectory_file: имя yaml с custom траекторией ─────────────────
    # Когда непусто — узел открывает этот файл, считывает trajectory и
    # waypoints_x/y оттуда, и подменяет соответствующие поля.
    # Path resolution:
    #   • bare filename / relative path → ищется в swarm_controller/config/
    #     (та же директория, что и этот yaml — там же drawer сохраняет)
    #   • absolute path / ~ → как есть
    # Output из `ros2 run trajectory_drawer draw -o my_trajectory.yaml`
    # ложится прямо в config/ (через --symlink-install в src) и подхваты-
    # вается одной строкой ниже. Альтернативно можно передать
    # `trajectory_file:=...` в ros2 launch (override через --params-file).
    trajectory_file: 'my_trajectory1.yaml'
    # ── lateral_controller — выбор поперечного контроллера для lanelet ──
    #   'pure_pursuit' — геометрический pure pursuit (классика, default)
    #   'mpc'          — тот же SwarmLatController что и у followers
    # При 'mpc' активны параметры lat_* ниже (defaults матчат
    # params_swarm_lat.yaml — переопредели если нужен другой tuning).
    lateral_controller: mpc
    lat_tau_w: 0.03
    lat_ts: 0.05
    lat_p: 40
    lat_c: 30
    lat_s: 5.0
    lat_phi_vals: [0.6, 0.95, 0.6]
    lat_q_vals:   [10.0, 1.0, 0.0]   # [q_e, q_eθ, q_α]
    lat_alpha_min: -2.0
    lat_alpha_max:  2.0
    lat_w_cmd_min: -1.5
    lat_w_cmd_max:  1.5
    odom_topic: ''   # default: /robot{pacemaker_idx}/odom
    # ── longitudinal_controller — выбор продольного контроллера ─────────
    #   'constant' — open-loop linear_vel (default)
    #   'mpc'      — kinematic CC MPC (adas-exact: state [v, a, j], accel lag τ)
    longitudinal_controller: constant
    # Kinematic CC MPC: single time-constant τ (acceleration lag). Output is
    # [v − v_ref, a, j]. Control is a_cmd; v_cmd is integrated outside the
    # controller and clipped to [cc_v_cmd_min, cc_v_cmd_max].
    cc_tau: 0.15        # acceleration time constant [s]
    cc_ts: 0.05
    cc_p: 40
    cc_c: 30
    cc_s: 20.0
    cc_phi_vals: [0.6, 0.6, 0.6]
    cc_q_vals:   [10.0, 1.0, 0.0]   # [q_v_err, q_a, q_j]
    cc_a_min: -0.5
    cc_a_max:  0.5
    cc_v_cmd_min: 0.0
    cc_v_cmd_max: 0.5
    # Circle R=4m, center=(0,4), 36 waypoints, counterclockwise, start at (0,0)
    waypoints_x: [
       0.000,  0.694,  1.368,  2.000,  2.571,  3.064,
       3.464,  3.759,  3.939,  4.000,  3.939,  3.759,
       3.464,  3.064,  2.571,  2.000,  1.368,  0.694,
       0.000, -0.694, -1.368, -2.000, -2.571, -3.064,
      -3.464, -3.759, -3.939, -4.000, -3.939, -3.759,
      -3.464, -3.064, -2.571, -2.000, -1.368, -0.694
    ]
    waypoints_y: [
      0.000,  0.061,  0.241,  0.536,  0.936,  1.429,
      2.000,  2.632,  3.305,  4.000,  4.695,  5.368,
      6.000,  6.571,  7.064,  7.464,  7.759,  7.939,
      8.000,  7.939,  7.759,  7.464,  7.064,  6.571,
      6.000,  5.368,  4.695,  4.000,  3.305,  2.632,
      2.000,  1.429,  0.936,  0.536,  0.241,  0.061
    ]
