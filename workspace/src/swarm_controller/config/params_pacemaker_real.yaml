# Pacemaker config for REAL robot (vs simulator).
#
# Differences from params_pacemaker.yaml:
#   - linear_vel reduced (0.4 -> 0.2) for first runs
#   - cc_a_max and cc_v_cmd_max reduced for safer acceleration profile
#
# Both MPCs are enabled by default (longitudinal kinematic CC + lateral MPC).
# Trajectory mode mirrors sim (straight | circle | lanelet); choose via
# `trajectory:` and override path via `trajectory_file:=...` at launch.

/**:
  ros__parameters:
    # ── ROBOT IDENTITY — edit these for your stand ────────────────────
    pacemaker_idx: 2                # robot index on the namespace
    cmd_vel_topic: /robot2/cmd_vel  # where the drive controller listens
    odom_topic: ''                  # '' => /robot{pacemaker_idx}/odom

    # ── runtime safety ────────────────────────────────────────────────
    start: false                    # kill-switch: flip true to publish
    logs_dir: /home/user/swarm_ws/swarm_logs

    # ── trajectory ────────────────────────────────────────────────────
    trajectory: lanelet             # straight | circle | lanelet
    linear_vel: 0.2                 # [m/s]
    circle_linear_vel: 0.2          # [m/s]  tangential speed for circle
    circle_radius: 4.0              # [m]    circle radius (w = v / R)
    lookahead_dist: 1.0             # [m]    pure pursuit lookahead distance

    # Trajectory file — bare filename resolves under swarm_controller/config/.
    # Override at launch via `trajectory_file:=my_trajectory4.yaml`.
    trajectory_file: 'sirius2.yaml'

    # ── lateral controller (active in lanelet mode) ───────────────────
    lateral_controller: mpc
    lat_tau_w: 0.03
    lat_ts: 0.05
    lat_p: 40
    lat_c: 30
    lat_s: 5.0
    lat_phi_vals: [0.6, 0.95, 0.6]
    lat_q_vals:   [10.0, 1.0, 0.0]   # [q_e, q_eθ, q_α]
    lat_alpha_min: -2.0
    lat_alpha_max:  2.0
    lat_w_cmd_min: -1.5
    lat_w_cmd_max:  1.5

    # ── longitudinal controller ───────────────────────────────────────
    # 'mpc' = kinematic CC MPC (adas-exact: state [v, a, j], accel lag τ).
    longitudinal_controller: mpc
    cc_tau: 0.15
    cc_ts: 0.05
    cc_p: 40
    cc_c: 30
    cc_s: 40.0                       # heavier move suppression -> smoother a_cmd
    cc_phi_vals: [0.85, 0.6, 0.6]    # slower v-error decay -> gentle ramp
    cc_q_vals:   [10.0, 1.0, 0.0]    # [q_v_err, q_a, q_j]
    cc_a_min: -0.15                  # capped to limit jerk on start/stop
    cc_a_max:  0.15
    cc_v_cmd_min: 0.0                # robot can stop fully
    cc_v_cmd_max: 0.5                # headroom above linear_vel=0.4 for Coulomb

    # Fallback waypoints if no trajectory_file is provided: circle R=4 m,
    # center (0,4), 36 points CCW, start at (0,0).
    waypoints_x: [
       0.000,  0.694,  1.368,  2.000,  2.571,  3.064,
       3.464,  3.759,  3.939,  4.000,  3.939,  3.759,
       3.464,  3.064,  2.571,  2.000,  1.368,  0.694,
       0.000, -0.694, -1.368, -2.000, -2.571, -3.064,
      -3.464, -3.759, -3.939, -4.000, -3.939, -3.759,
      -3.464, -3.064, -2.571, -2.000, -1.368, -0.694
    ]
    waypoints_y: [
      0.000,  0.061,  0.241,  0.536,  0.936,  1.429,
      2.000,  2.632,  3.305,  4.000,  4.695,  5.368,
      6.000,  6.571,  7.064,  7.464,  7.759,  7.939,
      8.000,  7.939,  7.759,  7.464,  7.064,  6.571,
      6.000,  5.368,  4.695,  4.000,  3.305,  2.632,
      2.000,  1.429,  0.936,  0.536,  0.241,  0.061
    ]
