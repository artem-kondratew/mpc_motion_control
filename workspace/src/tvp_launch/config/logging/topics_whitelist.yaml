# СПРАВОЧНО. Активный рекордер — regex в ricar-launch/docker-compose.yaml (профиль logging).
# Все топики под namespace робота: /<vehicle_id>/...  (пример ниже для vehicle_id=alpha).
# /tf и /tf_static — ГЛОБАЛЬНЫЕ (tf2_ros публикует абсолютно), фреймы внутри префиксованы <vehicle_id>/.
topics:
  # tf (глобальные; фреймы внутри = <vehicle_id>/...)
  - /tf
  - /tf_static

  # --- Контроллеры: продольный CC (диагностика для графиков) ---
  - /alpha/control/v_ref            # целевая скорость
  - /alpha/control/v_meas           # измеренная (из odom)
  - /alpha/control/v_cmd            # команда скорости
  - /alpha/control/v_error          # ошибка скорости (v_ref - v_meas)

  # --- Контроллеры: боковой / удержание в полосе ---
  - /alpha/control/e_lat            # поперечная ошибка
  - /alpha/control/e_theta          # угловая ошибка
  - /alpha/control/w_cmd            # команда угловой скорости
  - /alpha/control/w_meas           # измеренная угловая (kobuki гиро)

  # --- Команды и состояние шасси ---
  - /alpha/control/long_cmd         # продольная команда CC -> lateral (Twist)
  - /alpha/control/pacemaker/path   # полоса для lateral (lane_publisher)
  - /alpha/cmd_vel                  # итоговая команда (Twist)
  - /alpha/commands/velocity        # вход kobuki
  - /alpha/odom                     # одометрия kobuki (twist.linear.x=энкодеры, angular.z=гиро)

  # --- Локализация (поза) ---
  - /alpha/lio_sam/mapping/odometry # глобальная поза lio_sam (frame <vehicle_id>/lio_sam_odom)
  - /alpha/lio_sam/mapping/path     # траектория lio_sam (история поз)

  # --- Сенсорика (лёгкое; PointCloud2 не пишем) ---
  - /alpha/sensing/livox/imu        # IMU MID360
  - /alpha/sensing/vehicle_velocity_converter/twist_with_covariance   # оценка скорости по лидару

  # metadata
  - /human_triggers                 # строковые сообщения оператора (ricar trigger; глобальный)
