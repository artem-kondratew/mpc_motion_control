/**:
  ros__parameters:
    input_topics:
      - livox/imu_10_10_10_50
      - livox/lidar_10_10_10_50

    frame_names:
      - imu_50
      - lidar_50

    # ОТНОСИТЕЛЬНЫЕ (без "/"): под namespace sensing робота резолвятся в
    # /<vehicle_id>/sensing/livox/{imu,points}.
    output_topics:
      - livox/imu
      - livox/points

    queue_size: 10
